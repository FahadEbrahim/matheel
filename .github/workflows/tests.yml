name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Gradio app version references
        run: python scripts/sync_gradio_app_version.py --check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Provision code grammars
        run: matheel grammars

      - name: Run tests
        run: python -m pytest

  parser-chunking:
    name: Parser and chunking (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-15
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    env:
      TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ runner.temp }}/matheel-grammars
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install chunking and parser test dependencies
        run: python -m pip install -e ".[dev,chunking_code]" "apted>=1,<2"
      - name: Check clean-cache offline startup (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo env "TREE_SITTER_LANGUAGE_PACK_CACHE_DIR=$TREE_SITTER_LANGUAGE_PACK_CACHE_DIR" \
            unshare --net --setuid="$(id -u)" --setgid="$(id -g)" \
            "$(command -v python)" -m pytest tests/test_grammars.py -k clean_cache
      - name: Provision Matheel grammars
        run: matheel grammars
      - name: Run parser and chunking tests with network blocked (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo env "TREE_SITTER_LANGUAGE_PACK_CACHE_DIR=$TREE_SITTER_LANGUAGE_PACK_CACHE_DIR" \
            HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            unshare --net --setuid="$(id -u)" --setgid="$(id -g)" "$(command -v python)" \
            -m pytest tests/test_grammars.py tests/test_chunking.py tests/test_code_metrics.py tests/test_similarity.py
      - name: Run parser and chunking tests
        if: runner.os != 'Linux'
        run: python -m pytest tests/test_grammars.py tests/test_chunking.py tests/test_code_metrics.py tests/test_similarity.py

  benchmark-regression:
    name: Offline benchmark regression
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install offline benchmark dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check score parity and record timings
        run: python scripts/check_benchmark_regressions.py --output benchmark-regression.json
      - name: Preserve score and timing diagnostics
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: benchmark-regression
          path: benchmark-regression.json

  minimum-dependencies:
    name: Minimum dependency smoke
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verified dependency floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "click==8.2.0" \
            "pandas==2.2.2" \
            "numpy==2.0.0" \
            "tqdm==4.66.3" \
            "rapidfuzz==3.1.0" \
            "bert-score==0.3.13" \
            "sentence-transformers==6.1.0" \
            "umap-learn==0.6.0"
          python -m pip install -e ".[dev,metrics,sentence_transformers,visualization]"
          python -m pip check

      - name: Verify critical floors and optional imports
        run: |
          python - <<'PY'
          from importlib.metadata import version

          expected = {
              "click": "8.2.0",
              "pandas": "2.2.2",
              "numpy": "2.0.0",
              "tqdm": "4.66.3",
              "rapidfuzz": "3.1.0",
              "bert-score": "0.3.13",
              "sentence-transformers": "6.1.0",
              "umap-learn": "0.6.0",
          }
          installed = {name: version(name) for name in expected}
          assert installed == expected, installed

          from bert_score import BERTScorer  # noqa: F401
          from sentence_transformers import MultiVectorEncoder, SentenceTransformer  # noqa: F401
          import umap  # noqa: F401
          PY

      - name: Run offline floor regressions
        run: |
          python -m pytest tests/test_preprocessing.py tests/test_visualization.py
          python -m pytest tests/test_lexical.py tests/test_feature_weights.py
          python -m pytest tests/test_cli.py -k cli_and_package_expose_version
          python -m pytest tests/test_vectors.py tests/test_model_routing.py tests/test_similarity.py \
            -k "multivector or pooling"

  codebleu-compatibility:
    name: CodeBLEU compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and external CodeBLEU
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # CodeBLEU 0.7.0 pins an older Tree-sitter than Matheel's language pack.
          # Install its Python code only so the compatibility tests use Matheel's runtime.
          python -m pip install --no-deps "codebleu==0.7.0"
          python -m pip install \
            "tree-sitter-c==0.24.2" \
            "tree-sitter-java==0.23.5" \
            "tree-sitter-php==0.24.1"

      - name: Run native-to-pip compatibility tests
        run: |
          matheel grammars c java php csharp
          python -m pytest tests/test_code_metrics.py \
            -k native_codebleu_matches_pip_selected_exact_examples

  gradio-smoke:
    name: Gradio smoke
    runs-on: ubuntu-latest
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and Gradio test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gradio]"

      - name: Run Gradio structure and launch checks
        run: >-
          python -m pytest tests/test_gradio_app.py tests/test_gradio_html_utils.py
          tests/test_gradio_result_analysis.py

  gradio-browser:
    name: ${{ matrix.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            job-name: Gradio browser workflows
            extras: "dev,gradio,browser"
            failure-artifact: gradio-browser-failure-artifacts
          - python-version: "3.14"
            job-name: Gradio browser workflows (Python 3.14)
            extras: "all,dev,browser"
            failure-artifact: gradio-browser-failure-artifacts-py3.14
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      MATHEEL_BROWSER_ARTIFACTS_DIR: test-results/browser

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"
          python -m pip check

      - name: Provision code grammars
        run: matheel grammars

      - name: Run visualization tests with full extras
        if: matrix.python-version == '3.14'
        run: |
          python -c "import umap"
          python -m pytest -W error::FutureWarning:umap tests/test_visualization.py

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run offline Gradio browser workflows
        run: |
          python -m pytest -o addopts='' -m browser tests/browser --collect-only -q
          python -m pytest -o addopts='' -m browser tests/browser \
            --browser chromium \
            --tracing retain-on-failure \
            --video retain-on-failure \
            --screenshot only-on-failure \
            --output test-results/browser

      - name: Preserve browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ matrix.failure-artifact }}
          path: test-results/browser
          if-no-files-found: warn
          retention-days: 7

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test the wheel
        run: |
          python -m venv "${RUNNER_TEMP}/matheel-smoke"
          "${RUNNER_TEMP}/matheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/matheel-smoke/bin/matheel" --help
          "${RUNNER_TEMP}/matheel-smoke/bin/python" -c \
            "import matheel; print(matheel.__version__)"
