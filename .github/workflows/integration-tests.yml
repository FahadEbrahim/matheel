name: Real Integration Tests

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version to use for the integration run.
        required: true
        default: "3.12"
        type: choice
        options:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
      suite:
        description: Optional integrations to run.
        required: true
        default: all
        type: choice
        options:
          - all
          - models
          - detectors

permissions:
  contents: read

concurrency:
  group: real-integration-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  models:
    name: Python ${{ inputs.python-version || '3.12' }} real models
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'models'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HOME: /home/runner/.cache/huggingface
      HF_HUB_CACHE: /home/runner/.cache/huggingface/hub
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-py${{ inputs.python-version || '3.12' }}-${{ hashFiles('scripts/ci/prepare_real_models.py') }}
          restore-keys: |
            hf-models-${{ runner.os }}-py${{ inputs.python-version || '3.12' }}-
            hf-models-${{ runner.os }}-

      - name: Document integration requirements
        run: |
          echo "This workflow installs matheel[semantic,chunking,dev]."
          echo "It may download public Hugging Face model weights and cache them under ${HF_HOME}."
          echo "The default pull-request workflow does not run these tests."

      - name: Install package with real-model extras
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[semantic,chunking,dev]"

      - name: Cache the pinned model revisions
        timeout-minutes: 15
        run: python scripts/ci/prepare_real_models.py --env-file "$GITHUB_ENV" --metadata-out test-results/models.json

      - name: Check integration test selection
        run: python -m pytest -o addopts='' -m integration tests/test_real_models.py tests/test_experiment_real_models.py --collect-only

      - name: Run real-model integration tests
        timeout-minutes: 10
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m pytest -o addopts='' -m integration tests/test_real_models.py tests/test_experiment_real_models.py --junitxml=test-results/models.xml -rs
          python scripts/ci/check_integration_report.py test-results/models.xml --tests 4 --allowed-skips 0

      - name: Retain model test results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: real-model-results-py${{ inputs.python-version || '3.12' }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  detectors:
    name: Python ${{ inputs.python-version || '3.12' }} local detectors
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'detectors'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
          cache: pip

      - name: Install base package and test tools
        timeout-minutes: 5
        run: python -m pip install -e ".[dev]"

      - name: Provision pinned local runtimes and detectors
        timeout-minutes: 12
        run: bash scripts/ci/setup_external_detectors.sh "$RUNNER_TEMP/matheel-detectors" "$GITHUB_ENV"

      - name: Record portable detector identities
        run: python scripts/ci/record_detector_versions.py --output test-results/detectors.json

      - name: Check integration test selection
        run: python -m pytest -o addopts='' -m integration tests/test_external_detectors_integration.py --collect-only

      - name: Run local-detector integration tests
        timeout-minutes: 6
        run: |
          python -m pytest -o addopts='' -m integration tests/test_external_detectors_integration.py --junitxml=test-results/detectors.xml -rs
          python scripts/ci/check_integration_report.py test-results/detectors.xml --tests 8 --allowed-skips 1 --skip-reason "Dolos exposes a symmetric score; directional mode belongs to JPlag."

      - name: Retain detector test results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: local-detector-results-py${{ inputs.python-version || '3.12' }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
