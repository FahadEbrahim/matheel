name: Sync Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "gradio_app/**"
      - ".github/workflows/sync-hf-space.yml"
  workflow_run:
    workflows:
      - Publish
    types:
      - completed
  workflow_dispatch:
    inputs:
      retry_failed_build:
        description: Retry an existing failed Space build after verifying the published package.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hf-space-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Space files
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Gradio app version references
        run: python scripts/sync_gradio_app_version.py --check

      - name: Check pinned Matheel release and package source on PyPI
        id: pinned-release
        timeout-minutes: 12
        run: python scripts/check_pinned_matheel_release.py --check-source

      - name: Sync Gradio app to Hugging Face Space
        if: steps.pinned-release.outputs.should_sync_space == 'true'
        env:
          HF_REPO_ID: ${{ vars.HF_SPACE_REPO || 'buelfhood/matheel-framework' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          space_dir="${RUNNER_TEMP}/hf-space"
          staging_dir="${RUNNER_TEMP}/gradio-app"
          hf_username="${HF_REPO_ID%%/*}"

          git clone --depth 1 \
            "https://huggingface.co/spaces/${HF_REPO_ID}" \
            "${space_dir}"
          mkdir -p "${staging_dir}"
          git archive HEAD:gradio_app | tar -x -C "${staging_dir}"
          rsync --archive --checksum --delete \
            --exclude=".git/" \
            --exclude=".gitattributes" \
            "${staging_dir}/" \
            "${space_dir}/"

          git -C "${space_dir}" config user.name "github-actions[bot]"
          git -C "${space_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${space_dir}" add --all

          if git -C "${space_dir}" diff --cached --quiet; then
            echo "Space is already synchronized."
            exit 0
          fi

          git -C "${space_dir}" commit -m "Sync from GitHub Actions"
          git -C "${space_dir}" push \
            "https://${hf_username}:${HF_TOKEN}@huggingface.co/spaces/${HF_REPO_ID}" \
            HEAD:main

      - name: Retry a failed Space build
        if: github.event_name == 'workflow_dispatch' && inputs.retry_failed_build && steps.pinned-release.outputs.should_sync_space == 'true'
        env:
          HF_REPO_ID: ${{ vars.HF_SPACE_REPO || 'buelfhood/matheel-framework' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          endpoint="https://huggingface.co/api/spaces/${HF_REPO_ID}"
          stage=$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer ${HF_TOKEN}" "${endpoint}/runtime" | jq -er '.stage')
          if [[ "${stage}" != BUILD_ERROR ]]; then
            echo "Space stage is ${stage}. No build retry was needed."
            exit 0
          fi

          # Log only the reason category. Authenticated Space logs stay in the runner.
          build_log=$(mktemp)
          trap 'rm -f "${build_log}"' EXIT
          curl --fail --silent --max-time 12 -H "Authorization: Bearer ${HF_TOKEN}" \
            "${endpoint}/logs/build?tail=150" -o "${build_log}" || true
          if grep -Fq 'No matching distribution found for matheel' "${build_log}"; then
            echo "The previous build could not see the pinned Matheel version in the package index."
          elif grep -Fq 'No space left on device' "${build_log}"; then
            echo "The previous build ran out of storage."
          elif grep -Fiq 'permission denied' "${build_log}"; then
            echo "The previous build encountered a filesystem permission error."
          else
            echo "The previous build did not expose a recognized error category."
          fi
          curl --fail --silent --show-error --max-time 30 --request POST \
            -H "Authorization: Bearer ${HF_TOKEN}" "${endpoint}/restart" \
            | jq -er '"Requested a retry. Space stage is \(.stage)."'
