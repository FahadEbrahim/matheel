site_name: Matheel
site_description: Documentation for Matheel source-code similarity workflows.
site_url: https://fahadebrahim.github.io/matheel/
repo_url: https://github.com/FahadEbrahim/matheel
repo_name: FahadEbrahim/matheel
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: readthedocs
  highlightjs: true

nav:
  - Getting started:
      - Overview: index.md
      - Install and quick start: usage.md
      - Gradio app: gradio.md
  - Compare code:
      - Choose similarity metrics: choosing_metrics.md
      - Lexical metrics: lexical.md
      - Embeddings and routing: vectors.md
      - Code-aware metrics: code_metrics.md
      - Local plagiarism detectors: external_detectors.md
      - Prepare code:
          - Preprocessing: preprocessing.md
          - Tokenization and limits: tokenization.md
          - Chunking: chunking.md
      - Comparison suites: comparison_suite.md
  - Evaluate and benchmark:
      - Load and evaluate datasets: datasets.md
      - Exact scoring and scalable retrieval: scalable_retrieval.md
      - Interpret and calibrate scores: scoring.md
      - Reproducible benchmark: reproducible_benchmark.md
      - Versioned plagiarism benchmarks: benchmark_protocol.md
      - Benchmark workflow recipes: benchmark_workflows.md
      - Plagiarism benchmark results: plagiarism_results.md
      - Leaderboards and run registry: leaderboard.md
  - Inspect results:
      - Visualization: visualization.md
      - Errors and uncertainty: result_analysis.md
  - Extend and contribute:
      - Custom algorithms: customization.md
      - Contributing algorithms: contributing_algorithms.md
      - Contributing datasets: contributing_datasets.md
      - Development: development.md

exclude_docs: |
  README.md
